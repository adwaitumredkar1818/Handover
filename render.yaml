services:
  - type: web
    name: the-handover-api
    runtime: python
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1 --proxy-headers --forwarded-allow-ips='*'"
    healthCheckPath: /health
    autoDeployTrigger: off
    envVars:
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: APP_NAME
        value: "Intelligent Project Knowledge Reconstruction & Handover Platform"
      - key: BACKEND_HOST
        value: 0.0.0.0
      - key: INFERENCE_MODE
        value: disabled
      - key: POSTGRES_SSL_MODE
        value: require
      - key: POSTGRES_CONNECT_TIMEOUT_SECONDS
        value: "15"
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_ACCESS_TOKEN_EXPIRE_MINUTES
        value: "15"
      - key: JWT_REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"
      - key: JWT_ISSUER
        value: ipkrh-platform
      - key: JWT_AUDIENCE
        value: ipkrh-api
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: "none"
      - key: AUTH_RATE_LIMIT_ENABLED
        value: "true"
      - key: AUTH_RATE_LIMIT_MAX_ATTEMPTS
        value: "20"
      - key: AUTH_RATE_LIMIT_WINDOW_SECONDS
        value: "60"
      - key: SUPABASE_AUTH_ENABLED
        value: "true"
      - key: SUPABASE_AUTH_AUDIENCE
        value: authenticated
      - key: SUPABASE_AUTH_URL
        value: https://rjntmboskzyrsqcetzil.supabase.co
      - key: SUPABASE_AUTH_JWKS_URL
        value: https://rjntmboskzyrsqcetzil.supabase.co/auth/v1/.well-known/jwks.json
      - key: STORAGE_PROVIDER
        value: supabase_storage
      - key: SUPABASE_URL
        value: https://rjntmboskzyrsqcetzil.supabase.co
      - key: SUPABASE_STORAGE_BUCKET
        value: project-evidence
      - key: SUPABASE_STORAGE_TIMEOUT_SECONDS
        value: "30.0"
      - key: SUPABASE_STORAGE_MAX_RETRIES
        value: "2"
      - key: SUPABASE_STORAGE_RETRY_BACKOFF_SECONDS
        value: "0.5"
      - key: SUPABASE_STORAGE_VERIFY_CIPHERTEXT_SIZE
        value: "true"
      - key: MAX_UPLOAD_SIZE_MB
        value: "50"
      - key: MAX_DOCUMENT_PAGES
        value: "200"
      - key: INFERENCE_GATEWAY_ENABLED
        value: "false"
      - key: REDIS_ENABLED
        value: "false"
      # Sensitive secrets below must be supplied securely in the Render Dashboard (not stored in git):
      # - DATABASE_URL
      # - JWT_SECRET_KEY
      # - TOKEN_ENCRYPTION_KEY
      # - FILE_ENCRYPTION_KEY
      # - SUPABASE_SERVICE_ROLE_KEY
      # - CORS_ALLOWED_ORIGINS
